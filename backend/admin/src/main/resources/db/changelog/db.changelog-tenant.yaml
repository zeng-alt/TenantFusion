databaseChangeLog:

  # 独立租户库使用显式文件清单，避免 Native 下自建 Liquibase 执行器的动态目录枚举。
  # 保留原 SQL 文件路径与 changeset 标识；新增迁移时在这里追加一项。
  - include:
      file: ${tenantChangelogDir}/V0001-2026-10-02-init-tenant-store.sql
      relativeToChangelogFile: true
  - include:
      file: ${tenantChangelogDir}/V0002-2026-10-02-seed-demo-tenant.sql
      relativeToChangelogFile: true
  - include:
      file: ${tenantChangelogDir}/V0003-2026-10-02-seed-hybrid-demo-tenants.sql
      relativeToChangelogFile: true
  - include:
      file: ${tenantChangelogDir}/V0004-2026-11-20-isolate-master-tenant.sql
      relativeToChangelogFile: true

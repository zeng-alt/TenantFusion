server:
  port: 8080

spring:
  modulith:
    events:
      externalization:
        mode: outbox
  http:
    converters:
      preferred-json-mapper: jackson
    codecs:
      preferred-json-mapper: jackson
  application:
    name: admin-application
  profiles:
    active: dev

logging:
  register-shutdown-hook: false

# Outbox 表结构由 Liquibase 管理，与业务写入共用数据源和事务。
namastack:
  outbox:
    jdbc:
      schema-initialization:
        enabled: false

# i18n configuration (default: file mode)
#alt:
#  i18n:
#    mode: database
#    basename: messages
#    prefix: /api/i18n-messages

# 内置管理员的数据查询全量授权仍受当前租户边界限制。
alt:
  tenant:
    root-tenant-id: ""

security:
  abac:
    server:
      enabled: true
    client:
      enabled: true
      source: local
  whitelist:
    authenticated:
      - method: GET
        path: /v1/auth/tenants
      - method: GET
        path: /v1/auth/tenant
      - method: POST
        path: /v1/auth/current-role/switch/{code}/{rememberMe}
      - method: GET
        path: /v1/auth/admin
      - method: PATCH
        path: /v1/user/profile/{id}
      - method: POST
        path: /v1/auth/password
      - method: GET
        path: /v1/user/detail
      - method: GET
        path: /v1/menu/resource/tree
      - method: GET
        path: /v1/menu/resource/validate
  data-permission:
    administrator-all: true

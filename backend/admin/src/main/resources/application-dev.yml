spring:
  # 开启 Docker Compose 自动管理
  docker:
    compose:
      enabled: false
      file: backend/admin/compose.yaml
      # 配置远程虚拟机的 Docker 地址 (请将 192.168.x.x 替换为你虚拟机的实际 IP)
      host: tcp://192.168.56.106:2375
      # 可选: 设置生命周期，比如应用停止时不要停止容器（如果你希望它们一直运行）
      # lifecycle-management: start-only
  
  
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration

  # JPA / Hibernate 配置
  datasource:
    url: jdbc:h2:mem:admin_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password: 
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: none # 因为使用了 Liquibase，所以将其设为 validate（或 none）以防止 Hibernate 自动修改表结构
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 4

#  cache:
#    type: caffeine
#    caffeine:
#      spec: initialCapacity=100,maximumSize=500,expireAfterWrite=24h,expireAfterAccess=2h,recordStats

  # 开启 H2 控制台（可选），方便在浏览器查看数据库
  h2:
    console:
      enabled: true
      path: /h2-console

  liquibase:
    enabled: true
    # 显式声明 contexts：未指定时 Liquibase 会执行所有 changeset，
    # 标了 context:dev 的演示数据也照跑，起不到限制作用
    contexts: dev
    parameters:
      tenantName: master
      changelogDir: h2

# 国际化-数据库模式配置（取消注释以启用数据库模式）
# alt:
#   i18n:
#     mode: database


# 多租户。当前只接了 row 模块，故只有行级隔离可用。
# 四档隔离由「引入哪个模块」决定，不在这里开关：
#   模式级 -> schema-tenant-component + h2/pg 方言模块
#   库级   -> database-tenant-component + alt.tenant.datasources.*
#   表级   -> table-tenant-component，且实体需标 @TenantScope(table = true)
#   混合   -> hybrid-tenant-component（改为逐租户读 main_tenant.isolation_mode）
alt:
  tenant:
    enabled: true
    mode: ROW
    default-tenant-id: master
    # master 为超管租户，其请求绕过行级判别条件，可跨租户查看
    root-tenant-id: master

security:
  jwt-auth:
    # 仅供本地开发的默认密钥；生产必须通过 JWT_SECRET / JWT_SECRET_REFRESH 环境变量注入
    # admin 与 workflow 两个应用必须使用同一对密钥，否则 workflow 无法校验 admin 签发的 token
    base64-secret: "${JWT_SECRET:ZG3cghO+Qd36ICJZuAFhKSPGYhwwX4TeuYWGIheKDN/nMIe9QUgJW9mXC90j8Tn3C3jO8k0yz4NK7+UgWcbXQuHC6u/JCqNj7u9lXG85xw/52sT/X+LHWRRh4CLewHwT7HKgRUHpsejkJddTVUCfui2uZ2+V44fU29yZi6nYz4IhsOQjPCq7PFhyrInKsjjaQV8RiXu78VOB7tJlwE5sU5rtLCBSuiz8DHMY/iyxiv99u3pouob0NKsPdBDrgMSW}"
    base64-secret-refresh: "${JWT_SECRET_REFRESH:}"
    authentication: true
    validation: true
    login:
      loginPath: "/v1/login/jwt"
    logout:
      logoutPath: "/v1/logout/jwt"
  username-login:
    enabled: true
  captcha-auth:
    validation: true
    login-path: /v1/login/**

  filter:
    ignore-url:
      - "/v1/test/**"
      - "/v1/camunda-identity/**"
      - "/v1/auth/captcha"
      - "/v3/api-docs/**"
      - "/swagger-ui/**"
      - "/swagger-ui.html"
      - "/webjars/**"
  context:
    enabled-access: true
    admin:
      id: 1
      code: admin
  rbac:
    client:
      enabled: true


springdoc:
  info:
    title: zengAlt
    description: app--native接口文档
    version: 1.0.0

    contact:
      name: zengAlt
      email: admin@example.com
      url: https://example.com

    license:
      name: Apache License 2.0
      identifier: Apache-2.0
      # 或者使用 url（二选一）
      # url: https://www.apache.org/licenses/LICENSE-2.0.html

  external-docs:
    description: 开发文档
    url: https://example.com/docs

  servers:
    - url: http://localhost:8080
      description: 本地环境

    - url: https://api.example.com
      description: 生产环境

  tags:

    - name: 系统管理
      description: 系统管理接口

  components:

    security-schemes:

      bearerAuth:
        type: http
        scheme: bearer
        bearer-format: JWT
        description: JWT Bearer Token
#      session:
#        type: apiKey
#        in: cookie
#        name: JSESSIONID
#        description: Session Cookie

oss:
  s3:
    enabled: true
    # 本地文件存储要求绝对 file:// URI（FileSystemOssTemplate 用 Paths.get(URI) 解析，
    # 相对路径会被拒），而绝对路径无法跨平台共用一个默认值：
    #   Windows  file:///d:/data/oss
    #   mac/Linux  file:///Users/<你>/data/oss
    # 因此默认值保留 Windows 形态，非 Windows 上用 OSS_ENDPOINT 覆盖。
    endpoint: ${OSS_ENDPOINT:file:///d:/data/oss}
    storageType: file

  thumbnail:
    enabled: true
services:
  postgres:
    image: docker.io/library/postgres:16-alpine
    container_name: admin-postgres
    environment:
      # 与应用侧 DB_USERNAME / DB_PASSWORD 使用同一对变量，避免两边不一致
      # 未设置 DB_PASSWORD 时 docker compose 直接报错，不再落地默认口令
      POSTGRES_DB: ${DB_NAME:-admin_db}
      POSTGRES_USER: ${DB_USERNAME:-admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD 未设置，请先 export 或写入 backend/admin/.env}
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:alpine
    container_name: admin-redis
    ports:
      - "16379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
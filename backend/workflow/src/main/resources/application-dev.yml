spring:
  # JPA / Hibernate 配置
  datasource:
    url: jdbc:h2:file:./data/admin_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update # 开发环境自动建表（含流程表 wf_workflow / wf_workflow_version）
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 4

  # 开启 H2 控制台（可选），方便在浏览器查看数据库
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  info:
    title: zengAlt
    description: workflow接口文档
    version: 1.0.0

    contact:
      name: zengAlt
      email: admin@example.com
      url: https://example.com

security:
  jwt-auth:
    # 仅供本地开发的默认密钥；生产必须通过 JWT_SECRET / JWT_SECRET_REFRESH 环境变量注入
    # admin 与 workflow 两个应用必须使用同一对密钥，否则 workflow 无法校验 admin 签发的 token
    base64-secret: "${JWT_SECRET:ZG3cghO+Qd36ICJZuAFhKSPGYhwwX4TeuYWGIheKDN/nMIe9QUgJW9mXC90j8Tn3C3jO8k0yz4NK7+UgWcbXQuHC6u/JCqNj7u9lXG85xw/52sT/X+LHWRRh4CLewHwT7HKgRUHpsejkJddTVUCfui2uZ2+V44fU29yZi6nYz4IhsOQjPCq7PFhyrInKsjjaQV8RiXu78VOB7tJlwE5sU5rtLCBSuiz8DHMY/iyxiv99u3pouob0NKsPdBDrgMSW}"
    base64-secret-refresh: "${JWT_SECRET_REFRESH:}"
    validation: true
  context:
    enabled-access: true


operaton:
  bpm:
    authorization:
      enabled: false
      tenant-check-enabled: true
    job-execution:
      enabled: true
      deployment-aware: true
      core-pool-size: 4
      max-pool-size: 10
      queue-capacity: 3

alt:
  tenant:
    # workflow 无租户库直连权限，经 remote 读 admin；启用 core 的租户上下文链路
    #（JWT -> TenantContextHolder），业务实体按租户隔离。
    enabled: true
    mode: ROW
    default-tenant-id: master
    # 超级管理员仅管理当前租户。
    root-tenant-id: ""
    # 租户远程源：调用 admin 的 local 端点 GET /v1/tenants（保持鉴权，不开白名单）。
    # 用户链路透传当前请求 JWT；无用户上下文时（定时任务/启动预热）用 service-token（M2M）。
    remote:
      enabled: true
      base-url: http://127.0.0.1:8080
      # 必须与 admin 的 alt.tenant.store.service-key 一致（dev 同值联调，生产走环境变量）。
      service-token: ${TENANT_SERVICE_TOKEN:dev-tenant-sync-key}
    # 远端源中断时跳过启动校验（admin 未启动也能跑完校验阶段）。
    # 注意：这只是 validator 层面的逃生舱——Hibernate 首个路由连接（引擎初始化）
    # 仍需解析元数据，冷启动时 admin 必须可达；运行期已解析租户走注册表永久缓存，
    # admin 短暂中断不影响。生产编排里给 workflow 加上对 admin 的启动依赖。
    # admin 侧保持默认严格（fail-on-unavailable=true），本地库中断必须 fail-fast。
    hybrid:
      fail-on-unavailable: false
  camunda:
    identity:
      admin:
        enabled: true
        base-url: http://127.0.0.1:8080

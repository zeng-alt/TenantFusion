    # admin 与 workflow 两个应用必须使用同一对密钥，否则 workflow 无法校验 admin 签发的 token
    base64-secret: "${JWT_SECRET:ZG3cghO+Qd36ICJZuAFhKSPGYhwwX4TeuYWGIheKDN/nMIe9QUgJW9mXC90j8Tn3C3jO8k0yz4NK7+UgWcbXQuHC6u/JCqNj7u9lXG85xw/52sT/X+LHWRRh4CLewHwT7HKgRUHpsejkJddTVUCfui2uZ2+V44fU29yZi6nYz4IhsOQjPCq7PFhyrInKsjjaQV8RiXu78VOB7tJlwE5sU5rtLCBSuiz8DHMY/iyxiv99u3pouob0NKsPdBDrgMSW}"
    base64-secret-refresh: "${JWT_SECRET_REFRESH:}"
    validation: true
  context:
    enabled-access: true


camunda:
  bpm:
    authorization:
      enabled: false
      tenant-check-enabled: false
    job-execution:
      enabled: true
      deployment-aware: true
      core-pool-size: 4
      max-pool-size: 10
      queue-capacity: 3

alt:
  camunda:
    identity:
      admin:
        enabled: true
        base-url: http://127.0.0.1:8080
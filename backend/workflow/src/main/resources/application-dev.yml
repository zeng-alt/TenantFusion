spring:
  # JPA / Hibernate 配置
  datasource:
    url: jdbc:h2:mem:admin_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update # 因为使用了 Liquibase，所以将其设为 validate（或 none）以防止 Hibernate 自动修改表结构
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  # 开启 H2 控制台（可选），方便在浏览器查看数据库
  h2:
    console:
      enabled: true
      path: /h2-console

springdoc:
  info:
    title: zengAlt
    description: workflow接口文档
    version: 1.0.0

    contact:
      name: zengAlt
      email: admin@example.com
      url: https://example.com

security:
  context:
    enabled-access: false

camunda:
  bpm:
    authorization:
      enabled: false
    job-execution:
      enabled: true
      deployment-aware: true
      core-pool-size: 4
      max-pool-size: 10
      queue-capacity: 3
    admin-user:
      id: admin
      password: 123456

dev:
  bpm-crafters:
    process-api:
      adapter:
        c7embedded:
          enabled: true
          service-tasks:
            delivery-strategy: embedded_scheduled
            worker-id: embedded-worker
            max-task-count: 100
            lock-time-in-seconds: 10
            retry-timeout-in-seconds: 30
            retries: 3
            execute-initial-pull-on-startup: true
            schedule-delivery-fixed-rate-in-seconds: 10
          user-tasks:
            delivery-strategy: embedded_scheduled
            execute-initial-pull-on-startup: true
            schedule-delivery-fixed-rate-in-seconds: 10
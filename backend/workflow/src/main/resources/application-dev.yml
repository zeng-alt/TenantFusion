spring:
  # JPA / Hibernate 配置
  datasource:
    url: jdbc:h2:file:./data/admin_db;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: update # 开发环境自动建表（含流程表 wf_workflow / wf_workflow_version）
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      database: 4

  # 开启 H2 控制台（可选），方便在浏览器查看数据库
  h2:
    console:
      enabled: true
      path: /h2-console


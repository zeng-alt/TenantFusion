server:
  port: 8081

spring:
  http:
    converters:
      preferred-json-mapper: jackson
    codecs:
      preferred-json-mapper: jackson
  application:
    name: workflow-application
  profiles:
    active: dev

logging:
  register-shutdown-hook: false

alt:
  tenant:
    root-tenant-id: ""

security:
  context:
    admin:
      id: 1
      tenant: master

operaton:
  bpm:
    authorization:
      tenant-check-enabled: true
